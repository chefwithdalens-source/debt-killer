<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Debt Killer</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="logos/app/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="logos/app/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Debt Killer">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="topbar glass" role="banner">
  <div class="topbar-inner">
    <div class="brand"><img class="logo" src="logos/app/logo-40.png" srcset="logos/app/logo-40.png 1x, logos/app/logo-80.png 2x, logos/app/logo-120.png 3x" width="36" height="36" alt="">Debt Killer</div>
    <nav class="seg-nav" aria-label="Main">
      <button data-tab="home" class="seg">Home</button>
      <button data-tab="accounts" class="seg">Accounts</button>
      <button data-tab="calendar" class="seg">Calendar</button>
      <button data-tab="progress" class="seg">Progress</button>
    </nav>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<button class="fab glass" id="fab" hidden><span aria-hidden="true">＋</span> Add account</button>
<nav class="tabbar glass" aria-label="Main">
  <button data-tab="home" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="accounts" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18" class="cut"/></svg><span>Accounts</span></button>
  <button data-tab="calendar" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM5 9v10h14V9z"/><rect x="7" y="11" width="3" height="3" rx=".6"/><rect x="11" y="11" width="3" height="3" rx=".6"/></svg><span>Calendar</span></button>
  <button data-tab="progress" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zM10 20V4h4v16zM16 20v-7h4v7z"/></svg><span>Progress</span></button>
</nav>
<div id="dialogs"></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
