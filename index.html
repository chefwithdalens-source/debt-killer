<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Debt Killer</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="logos/app/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="logos/app/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Debt Killer">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="fonts/PirataOne-Killer.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<aside class="sidebar" aria-label="Sidebar"><div class="sb-brand"><img src="logos/app/logo-44.png" srcset="logos/app/logo-44.png 1x, logos/app/logo-88.png 2x" width="24" height="24" alt=""><span>Debt Killer</span></div><nav class="sb-nav" aria-label="Main"><button data-tab="home" class="sb-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic" d="M3.5 10.5 12 3.8l8.5 6.7V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button><button data-tab="accounts" class="sb-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ic" x="2.8" y="5" width="18.4" height="14" rx="2.6"/><path class="ln" d="M2.8 9.5h18.4M6.5 15h4"/></svg><span>Accounts</span></button><button data-tab="calendar" class="sb-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ic" x="3.5" y="4.8" width="17" height="15.7" rx="2.6"/><path class="ln" d="M3.5 9.5h17M8 2.8v4M16 2.8v4M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/></svg><span>Calendar</span></button><button data-tab="progress" class="sb-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic" d="M4.5 20.5v-8h3.5v8zM10.25 20.5V4h3.5v16.5zM16 20.5v-11h3.5v11z"/></svg><span>Progress</span></button></nav></aside>
<header class="topbar glass" role="banner">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-chip"><img class="logo" src="logos/app/logo-44.png" srcset="logos/app/logo-44.png 1x, logos/app/logo-88.png 2x, logos/app/logo-132.png 3x" width="44" height="44" alt="Debt Killer"></span></div>
    <nav class="seg-nav" aria-label="Main">
      <button data-tab="home" class="seg">Home</button>
      <button data-tab="accounts" class="seg">Accounts</button>
      <button data-tab="calendar" class="seg">Calendar</button>
      <button data-tab="progress" class="seg">Progress</button>
    </nav>
    <button class="btn sm primary header-add" id="headerAdd" hidden aria-label="Add account"><span aria-hidden="true">＋</span><span class="lbl-long"> Add account</span><span class="lbl-sm"> Add</span></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<button class="fab glass" id="fab" hidden><span aria-hidden="true">＋</span> Add account</button>
<nav class="tabbar glass" aria-label="Main">
  <span class="tab-bubble" aria-hidden="true"></span>
  <button data-tab="home" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic" d="M3.5 10.5 12 3.8l8.5 6.7V20a1 1 0 0 1-1 1H15v-6h-6v6H4.5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="accounts" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ic" x="2.8" y="5" width="18.4" height="14" rx="2.6"/><path class="ln" d="M2.8 9.5h18.4M6.5 15h4"/></svg><span>Accounts</span></button>
  <button data-tab="calendar" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="ic" x="3.5" y="4.8" width="17" height="15.7" rx="2.6"/><path class="ln" d="M3.5 9.5h17M8 2.8v4M16 2.8v4M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/></svg><span>Calendar</span></button>
  <button data-tab="progress" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ic" d="M4.5 20.5v-8h3.5v8zM10.25 20.5V4h3.5v16.5zM16 20.5v-11h3.5v11z"/></svg><span>Progress</span></button>
</nav>
<div id="dialogs"></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
